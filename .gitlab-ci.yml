stages:
  - preview
  - deploy

pages:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: preview
  image: ubuntu:22.04
  script:
    - apt-get update && apt-get install -y curl ca-certificates
    - curl -sL https://github.com/gohugoio/hugo/releases/download/v0.123.7/hugo_extended_0.123.7_Linux-64bit.tar.gz
      | tar xzf - -C /usr/local/bin hugo
    - hugo version
    - hugo
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "preview"

deploy:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  stage: deploy
  image: ubuntu:22.04
  script:
    - apt-get update && apt-get install -y curl python3-pip
    - pip3 install awscli
    - curl -sL https://github.com/gohugoio/hugo/releases/download/v0.123.7/hugo_extended_0.123.7_Linux-64bit.tar.gz
      | tar xzf - -C /usr/local/bin hugo
    - hugo version
    - hugo
    - aws s3 cp --acl public-read public/ s3://mikroways.net/ --recursive
    - aws configure set preview.cloudfront true
    - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
