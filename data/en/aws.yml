title: "AWS Partner | Mikroways"
hero:
  eyebrow: "AWS ADVANCED TIER SERVICES PARTNER"
  pretitle: "MIKROWAYS + AWS"
  title: "We drive safer, scalable and growth-ready cloud architectures"
  subtitle_1: "As an AWS Advanced Tier Services Partner, we help organizations design, optimize and evolve their AWS environments with a practical approach, real experience and focus on concrete business results."
  subtitle_2: "We combine official AWS best practices, applied technical expertise and execution capacity to support modernization, security, observability, optimization and continuous improvement processes."
  ctas:
    - label: "Let's talk about your AWS environment"
      url: "/contact"
      style: "outline"
    - label: "Discover our solutions"
      url: "#capacidades"
      style: "light"

alianza:
  title: "A strategic partnership to transform the cloud into a competitive advantage"
  body: |
    At Mikroways we work with AWS to support our customers in the evolution of their cloud platforms, combining technical expertise, proximity and a comprehensive vision of architecture, operations, security and performance.
  body_2: |
    Our partnership with AWS allows us to build solutions based on official standards, best practices recognized globally and a modern view on how to design, operate and scale cloud environments with greater strength.

credenciales:
  label: "Credentials"
  title: "Credentials that support our experience"
  description: "Our AWS proposal is backed by certifications, accreditations and specializations that reflect our team's level of preparation and our commitment to technical excellence."
  footer: "Each of these credentials strengthens our ability to accompany real projects with focus on architecture, security, operations, optimization and continuous improvement."
  aws_certifications:
    - title: "AWS Certified Cloud Practitioner"
      type: "hex"
    - title: "AWS Certified Solutions Architect Associate"
      type: "hex"
    - title: "AWS Certified Solutions Architect Professional"
      type: "hex"
    - title: "AWS Certified DevOps Engineer Professional"
      type: "hex"
  aws_partner_badges:
