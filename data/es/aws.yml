capacidades:
  label: "Capacidades"
  capability_label: "Capacidad"
  header: "Capacidades concretas para desafíos reales en AWS"
  intro_1: "No todas las organizaciones enfrentan los mismos desafíos, pero muchas comparten una necesidad común: construir entornos cloud más sólidos, más seguros y mejor preparados para crecer."
  intro_2: "En Mikroways acompañamos ese camino con capacidades específicas que nos permiten intervenir donde más valor podemos generar: desde la arquitectura hasta la operación, desde la seguridad hasta la optimización continua."
  items:
    - num: "01"
      title: "Arquitectura y modernización cloud"
      text_1: "Diseñamos y evolucionamos arquitecturas en AWS para que sean más escalables, resilientes y preparadas para acompañar el crecimiento del negocio."
      text_2: "Ayudamos a construir bases más sólidas para nuevas aplicaciones, modernización de cargas existentes y procesos de transformación tecnológica, priorizando decisiones que mejoran estabilidad, performance y capacidad de expansión."
      image: "/images/capabilities/capacidad.jpeg"
      dark: false
    - num: "02"
      title: "Seguridad, compliance y gobernanza"
      text_1: "Fortalecemos la postura de seguridad de los entornos AWS mediante buenas prácticas, controles, revisión de configuraciones y criterios de gobernanza que permiten reducir riesgos y mejorar el nivel de madurez de la organización."
      text_2: "Trabajamos tanto sobre la protección técnica de los workloads como sobre la necesidad de ordenar accesos, estructuras multi-account, políticas y trazabilidad operativa."
      image: "/images/capabilities/capacidad2.jpeg"
      dark: true
    - num: "03"
      title: "Operaciones, observabilidad y optimización continua"
      text_1: "Una buena arquitectura no alcanza si no puede sostenerse correctamente en el tiempo."
      text_2: "Por eso, ayudamos a construir entornos más observables, operables y eficientes, con foco en monitoreo, estabilidad, respuesta a incidentes, trazabilidad y mejora continua."
      image: "/images/capabilities/capacidad3.jpeg"
      dark: false

well_architected:
  label: "AWS Well-Architected"
  header: "Evaluá tu arquitectura con el framework oficial de AWS"
  intro_1: "El AWS Well-Architected Framework permite revisar cargas de trabajo en la nube a partir de seis pilares fundamentales: seguridad, fiabilidad, excelencia operacional, eficiencia de rendimiento, optimización de costos y sostenibilidad."
  intro_2: "Como partner certificado del programa AWS Well-Architected, en Mikroways ayudamos a las organizaciones a detectar riesgos, identificar oportunidades de mejora y construir una hoja de ruta clara para evolucionar sus entornos AWS con mejores prácticas oficiales."
  pillars:
    - name: "Excelencia operacional"
      desc: "Operaciones consistentes y preparadas para evolucionar"
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2zm0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/></svg>'
    - name: "Seguridad"
      desc: "Protección de identidades, accesos y workloads"
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>'
    - name: "Fiabilidad"
      desc: "Entornos resilientes con recuperación rápida"
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>'
    - name: "Eficiencia de rendimiento"
