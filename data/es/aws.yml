alianza:
  title: "Una alianza estratégica para transformar la nube en una ventaja competitiva"
  body: |
    En Mikroways trabajamos junto a AWS para acompañar a nuestros clientes en la evolución de sus plataformas cloud, combinando especialización técnica, cercanía y una visión integral sobre arquitectura, operaciones, seguridad y performance.
  body_2: |
    Nuestra alianza con AWS nos permite construir soluciones basadas en estándares oficiales, mejores prácticas reconocidas globalmente y una mirada moderna sobre cómo diseñar, operar y escalar entornos cloud con mayor solidez.

